name: emberdelve
description: "Emberdelve — turn-based dice-builder roguelite. Tsoro Studios."
publish_to: 'none'

# versionName+versionCode for Android.
version: 0.14.0+40

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Save-file location for autosave/meta persistence (the sim core stays
  # sealed pure Dart with zero runtime deps).
  path_provider: ^2.1.4
  # Music loops + SFX one-shots (assets-integration).
  audioplayers: ^6.1.0
  # Consent-gated, opt-in analytics (docs/telemetry-events.md).
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.6
  shared_preferences: ^2.3.3
  # Play Billing for the one-time Ember Forge unlock (spec R8). The plugin
  # adds com.android.vending.BILLING via manifest merge — no manual entry.
  # 3.3.0 pulls in_app_purchase_android >=0.5.0, which is Google Play Billing
  # Library 8.0.0. Play deprecates the 7.x line and rejects updates that still
  # ship it after 31 Aug 2026, so this floor is a store requirement, not taste.
  in_app_purchase: ^3.3.0
  # Play Games Services v2 (P4 cloud save + P5 leaderboards, v0.5.0).
  # Opt-in connect only — see lib/meta/play_games_service.dart header.
  games_services: ^5.3.0
  # Opt-in Daily Delve reminder (v0.6.0) — local notifications only, no
  # push infra, OFF by default. See lib/meta/reminder_service.dart header.
  flutter_local_notifications: ^22.3.0
  # zonedSchedule needs a TZ database + the device's IANA zone name.
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Frame trace on device/emulator (integration_test/frame_trace_test.dart,
  # remaining-work §1). Both ship with the SDK: no version pins.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - CREDITS.md
    - assets/images/sprite_meta.json
    - assets/images/enemies/
    - assets/images/characters/
    - assets/images/backgrounds/
    - assets/images/ui/
    - assets/images/ui/dice/
    - assets/images/ui/currency/
    - assets/images/ui/events/
    - assets/images/ui/nodes/
    - assets/images/ui/relics/
    - assets/audio/music/
    - assets/audio/sfx/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

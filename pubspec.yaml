name: emberdelve
description: "Emberdelve — pixel action-platformer. Tsoro Studios."
publish_to: 'none'

# versionName+versionCode for Android.
version: 1.0.0-alpha.2+14

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # 2D game engine (gameplay only; meta screens are plain Flutter).
  flame: ^1.29.0
  # Save-file location (atomic JSON save + .bak).
  path_provider: ^2.1.4
  # Music loops + SFX one-shots (kept from v1).
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - CREDITS.md
    - assets/levels/
    - assets/images/bg/
    - assets/images/enemies/
    - assets/images/fx/
    - assets/images/hud/
    - assets/images/items/
    - assets/images/player/
    - assets/images/player/skins/ember_monk/
    - assets/images/player/skins/shadow_thief/
    - assets/images/player/skins/hearth_knight/
    - assets/images/props/
    - assets/images/shop/
    - assets/images/tiles/
    - assets/audio/music/
    - assets/audio/sfx/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

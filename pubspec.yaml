name: emberdelve
description: "Emberdelve — turn-based dice-builder roguelite. Tsoro Studios."
publish_to: 'none'

# versionName+versionCode for Android.
version: 0.3.9+12

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # Save-file location for autosave/meta persistence (the sim core stays
  # sealed pure Dart with zero runtime deps).
  path_provider: ^2.1.4
  # Music loops + SFX one-shots (assets-integration).
  audioplayers: ^6.1.0
  # --- Telemetry phase 1 (docs/telemetry-events.md) ---
  # Crash reporting (legitimate interest, opt-out in Settings) + consent-gated
  # gameplay analytics. Both are no-ops until android/app/google-services.json
  # exists (see README §Telemetry) — Firebase init failure is caught.
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  # Consent + toggle persistence.
  shared_preferences: ^2.3.0
  # In-app "Send feedback": annotated screenshot + note, shared out via the
  # system share sheet (no backend, no extra data collection).
  feedback: ^3.2.0
  share_plus: ^12.0.2 # 13.x needs Dart >=3.10; repo pins Flutter 3.32.7/Dart 3.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - CREDITS.md
    - assets/images/sprite_meta.json
    - assets/images/enemies/
    - assets/images/characters/
    - assets/images/backgrounds/
    - assets/images/ui/
    - assets/images/ui/dice/
    - assets/images/ui/currency/
    - assets/images/ui/events/
    - assets/images/ui/nodes/
    - assets/images/ui/relics/
    - assets/audio/music/
    - assets/audio/sfx/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

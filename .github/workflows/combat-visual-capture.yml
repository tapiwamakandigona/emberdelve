name: Combat visual evidence (existing APK)

# Review tooling only. Install an already-published APK; do not build/sign a
# new app, access secrets, edit saves, or publish/deploy anything.
on:
  push:
    branches: [review/ember-combat-visuals-sep10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download unchanged released APK and verify bytes
        run: |
          mkdir -p build/combat-visual-evidence
          curl --fail --location --silent --show-error \
            'https://github.com/tapiwamakandigona/emberdelve/releases/download/v0.182.0/app-x86_64-release.apk' \
            -o build/review.apk
          echo 'fba20f19bd4b035b866f5eef4d43781df31c715276d4b4f4f60cc7221afd0c42  build/review.apk' | sha256sum --check
          python3 -m pip install --quiet --break-system-packages uiautomator2==3.5.0
      - name: Play and record existing Android release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: false
          script: python3 tool/review_combat_android.py
      - name: Upload captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-visual-evidence
          path: build/combat-visual-evidence/
          if-no-files-found: error
          retention-days: 14
